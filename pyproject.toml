[project]
name = "sugarlearning-tools"
version = "0.1.0"
description = "SugarLearning data tools, change tracker, and MCP server"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "click>=8.1",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "qdrant-client>=1.9",
    "sentence-transformers>=3.0",
    "fastmcp>=3.2",
]

[project.scripts]
sl = "sugarlearning_tools.cli:cli"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
browser = ["playwright>=1.40"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sugarlearning_tools"]
